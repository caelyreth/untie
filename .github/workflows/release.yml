name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Verify release tags
        run: |
          version="$(sed -n 's/^[[:space:]]*libraryVersion = "\([^"]*\)"/\1/p' version.go)"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(git rev-parse "v$version^{commit}")" = "$GITHUB_SHA"
          test "$(git rev-parse "contrib/mygo/v$version^{commit}")" = "$GITHUB_SHA"
          grep -Fq "github.com/caelyreth/untie v$version" contrib/mygo/go.mod
          grep -Fq "github.com/caelyreth/untie/contrib/mygo v$version" examples/mygo/go.mod
          grep -Fq "github.com/caelyreth/untie v$version" web/wasm/go.mod
      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes changelogithub@15.0.5
