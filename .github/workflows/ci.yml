name: ci

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.3
          cache: true
      - name: Fetch pinned upstream fixtures
        run: go run ./internal/quality/upstreamfetch fetch
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify modules
        run: |
          go mod verify
          cd contrib/mygo
          go mod verify
          cd ../../examples/mygo-simple
          go mod verify
          cd ../mygo-stream
          go mod verify
          cd ../../web/wasm
          go mod verify
      - name: Vet
        run: go vet ./...
      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
      - name: Test
        run: go test ./...
      - name: Test without cgo
        env:
          CGO_ENABLED: "0"
        run: go test ./...
      - name: Test MyGo example
        working-directory: examples/mygo-simple
        env:
          CGO_ENABLED: "0"
        run: |
          go test ./...
          go vet ./...
      - name: Test MyGo stream example
        working-directory: examples/mygo-stream
        env:
          CGO_ENABLED: "0"
        run: |
          go test ./...
          go vet ./...
      - name: Test MyGo contrib adapter
        working-directory: contrib/mygo
        env:
          CGO_ENABLED: "0"
        run: |
          go test ./...
          go vet ./...
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
      - name: Tagged TeX layout integration
        env:
          CGO_ENABLED: "0"
        run: go test -tags=layout_tex_integration ./internal/layout

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.3
          cache: true
      - name: Fetch pinned upstream fixtures
        run: go run ./internal/quality/upstreamfetch fetch
      - name: Race detector
        env:
          CGO_ENABLED: "1"
        run: |
          go test -race ./...
          cd contrib/mygo
          go test -race ./...
          cd ../../examples/mygo-simple
          go test -race ./...
          cd ../mygo-stream
          go test -race ./...

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: js, goarch: wasm }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.3
          cache: true
      - name: Compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch pinned upstream fixtures
        run: nix develop . --command go run ./internal/quality/upstreamfetch fetch
      - name: Install dependencies
        working-directory: web
        run: nix develop .. --command bun install --frozen-lockfile
      - name: Check
        working-directory: web
        run: nix develop .. --command bun run check
      - name: Lint
        working-directory: web
        run: nix develop .. --command bun run lint
      - name: Build site and Wasm
        working-directory: web
        run: nix develop .. --command bun run build
      - name: Deploy to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: web
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://untie.iki.moe' }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          nix develop .. --impure --command bash -eu -o pipefail -c '
            bunx vercel@65.10.0 pull --yes --environment=production --token "$VERCEL_TOKEN"
            mkdir -p .vercel/output/static
            cp -a build/. .vercel/output/static/
            printf "{\"version\":3}\n" > .vercel/output/config.json
            bunx vercel@65.10.0 deploy \
              --prebuilt \
              --prod \
              --token "$VERCEL_TOKEN"
          '
